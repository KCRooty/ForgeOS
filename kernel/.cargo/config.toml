[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true
# NOTA: si `cargo build` falla con "compiler built on 2026-04-14", es porque
# el rustc de Chocolatey se cuela antes en PATH. Fix: prepend el bin de rustup:
#   $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
# (o desinstalar rust de Chocolatey: choco uninstall rust)

[build]
target = "../targets/x86_64-forge.json"

[target.'cfg(target_os = "none")']
runner = "bash ../tools/run-qemu.sh"
